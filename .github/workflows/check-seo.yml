# Bramka SEO na pull requestach. Nie wdraża strony.
name: check-seo

on:
  pull_request:
  push:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Bramka SEO
        run: node scripts/check-seo.js
